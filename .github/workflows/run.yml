name: OCI ARM Capacity

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

concurrency:
  group: oci-arm-capacity
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring, zip
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare private key
        run: |
          printf '%s\n' "${{ secrets.OCI_PRIVATE_KEY }}" > "$RUNNER_TEMP/oci_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_key.pem"
          echo "OCI_PRIVATE_KEY_FILENAME=$RUNNER_TEMP/oci_key.pem" >> "$GITHUB_ENV"

      - name: Run script (batched for the hour)
        id: run
        shell: bash
        run: |
          set +e
          end=$((SECONDS + 3300))
          attempts=0
          last=""
          done="false"
          while [ "$SECONDS" -lt "$end" ]; do
            out=$(php index.php 2>&1)
            attempts=$((attempts + 1))
            last="$out"
            echo "--- attempt #$attempts at $(date -u +%H:%M:%S) ---"
            echo "$out"
            if printf '%s' "$out" | grep -qE 'ocid1\.instance|Already have an instance'; then
              done="true"
              break
            fi
            sleep 60
          done
          {
            echo "done=$done"
            echo "attempts=$attempts"
          } >> "$GITHUB_OUTPUT"
          printf '%s' "$last" > oci_last_output.txt
        env:
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
          OCI_AVAILABILITY_DOMAIN: ${{ secrets.OCI_AVAILABILITY_DOMAIN }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          OCI_IMAGE_ID: ${{ secrets.OCI_IMAGE_ID }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS }}
          OCI_SHAPE: ${{ secrets.OCI_SHAPE }}
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          TOO_MANY_REQUESTS_TIME_WAIT: ${{ secrets.TOO_MANY_REQUESTS_TIME_WAIT }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          DISCORD_GIF_URL: ${{ secrets.DISCORD_GIF_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_BOT_API_KEY: ${{ secrets.TELEGRAM_BOT_API_KEY }}

      - name: Send hourly summary
        if: steps.run.outputs.done != 'true'
        shell: bash
        run: |
          summary=$(tr '\n' ' ' < oci_last_output.txt | tr -s ' ' | head -c 300)
          export NOTIFY_MESSAGE="OCI ARM: no capacity after ${{ steps.run.outputs.attempts }} attempts this hour. Last result: $summary"
          php notify.php
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION_ID: ${{ secrets.DISCORD_MENTION_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          TELEGRAM_USER_ID: ${{ secrets.TELEGRAM_USER_ID }}
          TELEGRAM_BOT_API_KEY: ${{ secrets.TELEGRAM_BOT_API_KEY }}
